
name: "Build kernels"

env:
  CONFIGURATION: "repos.json"
  OUT_DIR: "out"

on:
  workflow_dispatch:

jobs:
  Set-repos:
    name: "🐂 Parse repos.json"
    runs-on: ubuntu-latest
    outputs:
      repos: ${{ steps.generate-matrix.outputs.repos }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Generate Matrix"
        id: generate-matrix
        run: |
          echo "repos=$(jq -c . ${{ env.CONFIGURATION }})" >> "$GITHUB_OUTPUT"

  Build-Kernel:
    name: "🐎 Build kernel"
    runs-on: ubuntu-latest
    needs: Set-repos

    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        repos: ${{ fromJSON(needs.Set-repos.outputs.repos) }}

    env:
      kernelDir: ${{ matrix.repos.kernelSource.name }}_${{ matrix.repos.kernelSource.device }}
      kernelName: ${{ matrix.repos.kernelSource.name }}
      kernelRepo: ${{ matrix.repos.kernelSource.repo }}
      kernelBranch: ${{ matrix.repos.kernelSource.branch }}
      kernelDevice: ${{ matrix.repos.kernelSource.device }}
      DEFCONFIG_NAME: ${{ matrix.repos.kernelSource.device }}_defconfig
      withKernelSU: ${{ matrix.repos.withKernelSU }}

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install prerequisites"
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc curl git zip \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            libssl-dev lftp zstd wget libfl-dev \
            python3 libarchive-tools jq flex bison \
            device-tree-compiler

      - name: "Clone kernel source"
        run: |
          git clone --depth=1 --recursive \
            --branch "${{ env.kernelBranch }}" \
            "${{ env.kernelRepo }}" \
            "${{ env.kernelDir }}/${{ env.kernelName }}"

      - name: "Clone RTL8811AU Driver"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          DRIVER_DIR="drivers/net/wireless/realtek/rtl8811au"
          mkdir -p "$(dirname "$DRIVER_DIR")"

          git clone --depth=1 \
            https://github.com/aircrack-ng/rtl8812au.git \
            "$DRIVER_DIR"

          MAKEFILE="drivers/net/wireless/realtek/Makefile"
          touch "$MAKEFILE"

          if ! grep -q 'rtl8811au/' "$MAKEFILE"; then
            echo 'obj-$(CONFIG_RTL8811AU) += rtl8811au/' >> "$MAKEFILE"
          fi

      - name: "Get toolchains"
        working-directory: ./${{ env.kernelDir }}
        env:
          toolchains: ${{ toJSON(matrix.repos.toolchains) }}
        run: |
          count=$(echo "$toolchains" | jq 'length')

          for ((i=0; i<count; i++)); do
            name=$(echo "$toolchains" | jq -r ".[$i].name")
            repo=$(echo "$toolchains" | jq -r ".[$i].repo")
            branch=$(echo "$toolchains" | jq -r ".[$i].branch")

            git clone --depth=1 --recursive \
              --branch "$branch" "$repo" "$name"

            echo "$(pwd)/$name" >> "$GITHUB_PATH"
            echo "$(pwd)/$name/bin" >> "$GITHUB_PATH"
          done

      - name: "Set build arguments"
        id: generate-args
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          params: ${{ toJSON(matrix.repos.params) }}
          extraParams: ${{ toJSON(matrix.repos.extraParams) }}
        run: |
          ARCH=$(echo "$params" | jq -r '.ARCH // empty')
          CROSS_COMPILE=$(echo "$params" | jq -r '.CROSS_COMPILE // empty')
          CROSS_COMPILE_COMPAT=$(echo "$params" | jq -r '.CROSS_COMPILE_COMPAT // empty')
          CLANG_TRIPLE=$(echo "$params" | jq -r '.CLANG_TRIPLE // empty')
          AR=$(echo "$params" | jq -r '.AR // empty')
          CC=$(echo "$params" | jq -r '.CC // empty')

          echo "ARCH=$ARCH" >> "$GITHUB_ENV"

          args="-j$(nproc --all)"

          [ -z "$ARCH" ] || args="$args ARCH=$ARCH"
          [ -z "$CROSS_COMPILE" ] || args="$args CROSS_COMPILE=$CROSS_COMPILE"
          [ -z "$CLANG_TRIPLE" ] || args="$args CLANG_TRIPLE=$CLANG_TRIPLE"
          [ -z "$CROSS_COMPILE_COMPAT" ] || args="$args CROSS_COMPILE_ARM32=$CROSS_COMPILE_COMPAT"
          [ -z "$AR" ] || args="$args AR=$AR"
          [ -z "$CC" ] || args="$args CC=$CC"

          mkdir -p "$(pwd)/${{ env.OUT_DIR }}"
          args="$args O=$(pwd)/${{ env.OUT_DIR }}"

          extra=$(echo "$extraParams" | jq -r '
            to_entries[] |
            select(.value != "" and .value != null) |
            "\(.key)=\(.value)"
          ' | tr '\n' ' ')

          args="$args $extra"

          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "Build arguments: $args"

      - name: "Update KernelSU"
        if: ${{ env.withKernelSU == 'true' }}
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          rm -rf KernelSU drivers/kernelsu

          curl -LSs \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -s main

          DEFCONFIG="./arch/${ARCH}/configs/${{ env.DEFCONFIG_NAME }}"

          echo "CONFIG_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_HAVE_KPROBES=y" >> "$DEFCONFIG"
          echo "CONFIG_KPROBE_EVENTS=y" >> "$DEFCONFIG"

      - name: "Make defconfig"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          make ${args} "${{ env.DEFCONFIG_NAME }}"

      - name: "Update kernel config"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          CONFIG="${{ env.OUT_DIR }}/.config"

          echo "CONFIG_OF_CONFIGFS=y" >> "$CONFIG"
          echo "CONFIG_OF_OVERLAY=y" >> "$CONFIG"

          make ${args} olddefconfig

      - name: "Build kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        env:
          args: ${{ steps.generate-args.outputs.args }}
        run: |
          make ${args}

      - name: "Check kernel output"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          BOOT="${{ env.OUT_DIR }}/arch/${ARCH}/boot"

          echo "Kernel files:"
          find "$BOOT" -maxdepth 3 -type f

          if [ ! -f "$BOOT/Image" ] && \
             [ ! -f "$BOOT/Image.gz" ] && \
             [ ! -f "$BOOT/Image.gz-dtb" ]; then
            echo "ERROR: Kernel image missing!"
            exit 1
          fi

      - name: "Clone AnyKernel3"
        run: |
          git clone --depth=1 \
            https://github.com/osm0sis/AnyKernel3.git \
            "${{ env.kernelDir }}/AnyKernel3"

      - name: "Prepare AnyKernel3"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          BOOT="${{ env.OUT_DIR }}/arch/${ARCH}/boot"
          AK3="../AnyKernel3"

          if [ -f "$BOOT/Image.gz-dtb" ]; then
            cp "$BOOT/Image.gz-dtb" "$AK3/Image.gz-dtb"
          elif [ -f "$BOOT/Image.gz" ]; then
            cp "$BOOT/Image.gz" "$AK3/Image.gz"
          elif [ -f "$BOOT/Image" ]; then
            cp "$BOOT/Image" "$AK3/Image"
          else
            echo "Kernel image not found!"
            exit 1
          fi

          if [ -f "$BOOT/dtbo.img" ]; then
            cp "$BOOT/dtbo.img" "$AK3/dtbo.img"
          fi

          if [ -d "$BOOT/dtb" ]; then
            cp -r "$BOOT/dtb" "$AK3/"
          fi

      - name: "Create AnyKernel3 ZIP"
        working-directory: ./${{ env.kernelDir }}/AnyKernel3
        run: |
          if [ ! -f anykernel.sh ]; then
            echo "ERROR: anykernel.sh missing!"
            exit 1
          fi

          zip -r9 \
            "../AnyKernel3-${{ env.kernelDevice }}-${{ env.kernelName }}.zip" \
            . \
            -x ".git/*" \
            -x "*.git*"

      - name: "Upload AnyKernel3 ZIP"
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-${{ env.kernelDevice }}-${{ env.kernelName }}
          path: ${{ env.kernelDir }}/AnyKernel3-${{ env.kernelDevice }}-${{ env.kernelName }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: "Upload kernel Image"
        uses: actions/upload-artifact@v4
        with:
          name: Image-${{ env.kernelDevice }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ matrix.repos.params.ARCH }}/boot/Image
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload Image.gz"
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-${{ env.kernelDevice }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ matrix.repos.params.ARCH }}/boot/Image.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload DTB"
        uses: actions/upload-artifact@v4
        with:
          name: dtb-${{ env.kernelDevice }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ matrix.repos.params.ARCH }}/boot/dtb
          if-no-files-found: ignore
          retention-days: 7

      - name: "Upload DTBO"
        uses: actions/upload-artifact@v4
        with:
          name: dtbo-${{ env.kernelDevice }}
          path: ${{ env.kernelDir }}/${{ env.kernelName }}/${{ env.OUT_DIR }}/arch/${{ matrix.repos.params.ARCH }}/boot/dtbo.img
          if-no-files-found: ignore
          retention-days: 7
